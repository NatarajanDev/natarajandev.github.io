name: Create resume.pdf alias

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resume-alias:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PDF alias if missing
        run: |
          if [ ! -f resume.pdf ]; then
            cp Natarajan_M_Modern_Resume.pdf resume.pdf
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add resume.pdf
            git commit -m "Add resume.pdf download alias"
            git push
          else
            echo "resume.pdf already exists"
          fi
