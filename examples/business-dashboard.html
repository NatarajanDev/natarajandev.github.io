<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Dashboard Demo | NatarajanDev</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#08111f;color:#dbe4f0}.wrap{width:min(1100px,92%);margin:auto}.top{padding:28px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #203047}.top a{color:#7dd3fc;text-decoration:none;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0}.card{padding:20px;border:1px solid #203047;border-radius:13px;background:#0d192b}.card small{color:#8fa1b7}.card strong{display:block;color:#fff;font-size:27px;margin-top:7px}.panel{padding:22px;border:1px solid #203047;border-radius:13px;background:#0d192b;margin-bottom:24px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}button,select{padding:9px 12px;border-radius:7px;border:1px solid #2b405c;background:#101f33;color:#dbe4f0}button{cursor:pointer;background:#2563eb;border-color:#2563eb}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:13px 9px;border-bottom:1px solid #203047}th{color:#7dd3fc}td{color:#b8c5d5}.status{display:inline-block;padding:4px 8px;border-radius:20px;background:#143525;color:#86efac;font-size:11px}.bar{height:9px;background:#18283d;border-radius:9px;overflow:hidden}.fill{height:100%;background:#38bdf8;border-radius:9px;width:78%}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}table{font-size:11px}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><strong>Operations Dashboard</strong><a href="../index.html">← Back to NatarajanDev</a></div><div class="grid"><div class="card"><small>Revenue</small><strong>$84,260</strong></div><div class="card"><small>Orders</small><strong>1,284</strong></div><div class="card"><small>Pending</small><strong>37</strong></div><div class="card"><small>Success Rate</small><strong>98.6%</strong></div></div><div class="panel"><h2>Orders</h2><div class="filters"><select id="filter"><option value="all">All statuses</option><option value="paid">Paid</option><option value="pending">Pending</option></select><button onclick="refresh()">Refresh Data</button></div><table><thead><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div><div class="panel"><h2>Workflow Health</h2><p>API processing <span style="float:right">78%</span></p><div class="bar"><div class="fill"></div></div><p>Automated validation <span style="float:right">92%</span></p><div class="bar"><div class="fill" style="width:92%"></div></div></div></div><script>const data=[['#10482','Acme Studio','$1,280','paid'],['#10481','Northwind Labs','$760','pending'],['#10480','Bright Retail','$2,140','paid'],['#10479','Atlas Media','$430','paid'],['#10478','Greenfield Co','$980','pending']];function render(){const f=document.getElementById('filter').value;document.getElementById('rows').innerHTML=data.filter(x=>f==='all'||x[3]===f).map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td><span class="status">${x[3]}</span></td></tr>`).join('')}function refresh(){render();alert('Demo data refreshed successfully.')}document.getElementById('filter').onchange=render;render();</script></body></html>
